<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
</head>
<body>

    <h2>Reset Password</h2>

    <form id="passwordForm">
        <label for="password">New Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="confirmPassword">Confirm Password:</label><br>
        <input type="password" id="confirmPassword" name="confirmPassword" required><br><br>

        <button type="submit">Update Password</button>
    </form>

    <p id="message"></p>

    <script>
        document.getElementById("passwordForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            // Confirm password validation
            if (password !== confirmPassword) {
                message.style.color = "red";
                message.innerText = "Passwords do not match";
                return;
            }

            // Optional password length validation
            if (password.length < 8) {
                message.style.color = "red";
                message.innerText = "Password must be at least 8 characters";
                return;
            }

            try {
                const response = await fetch("{{url_for('newpassword',user_email=user_email)}}", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: password
                    })
                });

                const data = await response.json();

                message.style.color = "green";
                message.innerText = data.message;

            } catch (error) {
                message.style.color = "red";
                message.innerText = "Error updating password";
            }
        });
    </script>

</body>
</html>
