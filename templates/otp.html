<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        div {
            background-color: azure;
            width: 100vw;
            height: 78.5vh;
        }
        input{
            border-radius: 10px;
            padding:5px 0px;
            border:1px black solid;
        }

        button{
            background-color: blue;
            color: white;
            padding:10px 40px;
            border-radius: 25px;
            border: none;
            font-weight: 550;
            margin-right: -35px;
        }

        button:hover{
            background-color:green;
            color:black;
            padding:10px 40px;
            border-radius: 25px;
            border: none;
            font-weight: 550;
            margin-right: -35px;
        }
    </style>
</head>

<body>
    <div>
        <center><br>
            <h1>OTP Verification</h1><br>
            <form method="post">
                <label>OTP : </label>
                <input type="text" name="otp" placeholder="  Enter OTP"><br><br>
                <a href=""> <button>submit</button> </a>
                <div><br>
                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <ul class=flashes>
                        {% for message in messages %}
                        <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                    {% endif %}
                    {% endwith %}
                </div>
                <!-- wfuw izkf plms jvfc -->
            </form>
        </center>
    </div>
</body>

</html>
